<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Flaticon -->
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

    <!-- Local Assets -->
    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="./assets/js/thanks.js"></script>

    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thankyou-card {
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
        }

        .thankyou-card h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text);
        }

        .thankyou-card p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .thankyou-icon {
            font-size: 3rem;
            color: var(--primary-accent);
            margin-bottom: 15px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="thankyou-card">
        <div class="thankyou-icon"><i class="fi fi-rr-check"></i></div>
        <h1>Thank You!</h1>
        <p>Your message has been received. I’ll get back to you as soon as possible.</p>
        <a href="https://soumiknandi.github.io"
            class="btn thankyou-btn align-items-center justify-content-center align-content-center">Back to
            Home</a>
    </div>

</body>

</html>
